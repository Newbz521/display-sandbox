# Firebase web config is embedded in the client bundle by design (VITE_*),
# and .firebaserc repeats the public project id — omit from Netlify secrets scan.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID"
  SECRETS_SCAN_OMIT_PATHS = ".firebaserc"
